<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Nodus</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0d1b3e;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
      }
      .tarjeta { max-width: 340px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 15px; color: #c9d1e3; margin: 0 0 24px; line-height: 1.45; }
      button {
        background: #f07e3a;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="tarjeta">
      <h1>Sin conexión</h1>
      <p>No pudimos conectar con Nodus. Revisa tu internet o tu Wi-Fi y vuelve a intentarlo.</p>
      <button onclick="location.href = 'https://app.nodusbc.mx/login'">Reintentar</button>
    </div>
  </body>
</html>
